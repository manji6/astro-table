name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: template-release
  cancel-in-progress: false

jobs:
  publish:
    # テンプレート利用サイトやPRのCIからは公開しない。
    if: >-
      github.repository == 'manji6/astro-table' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Publish versioned template release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error(`Expected a stable semantic version, received: ${version}`);
            }
            const tag = `v${version}`;
            const repo = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            try {
              await github.rest.repos.getReleaseByTag({ ...repo, tag });
              core.info(`${tag} is already released; leaving its tag and notes unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const body = fs.readFileSync(`releases/${tag}.md`, 'utf8');
            if (!body.trim()) throw new Error(`Release notes for ${tag} are empty.`);
            try {
              const { data } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              if (data.object.type !== 'commit' || data.object.sha !== sha) {
                throw new Error(`${tag} already exists at another target; refusing to move it.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: sha,
              name: `AstroTable ${tag}`,
              body,
              draft: false,
              prerelease: false,
            });
